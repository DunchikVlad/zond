# connections.yaml — профили подключений к БД-источникам (ADR-0009).
# Секретов в файле нет: только ${ENV}-интерполяция (blueprint п. 12).
# Для проверки без реальных секретов: source configs/ci.env
version: "1"

sources:
  # Тестовый контур (docs/progress/2026-10-18-test-environment.md):
  # БД-источники на 192.168.31.119, пароли стенда — через ENV.
  - name: ch-test
    type: clickhouse
    dsn: "clickhouse://test:${CH_TEST_PASSWORD}@192.168.31.119:9000/default"
    # schedule: "0 2 * * *" # периодический перескан источника (blueprint п. 15, cron; пусто — только ручной запуск)
    # Лимиты на источник (blueprint п. 13.2; 0/опущено — дефолт спецификации):
    # max_concurrent_scans: 1    # активных прогонов источника (serve)
    # max_concurrent_tables: 2   # таблиц в обработке одновременно внутри прогона
    # query_timeout_s: 300       # дедлайн запроса к БД, сек (5 мин)
    # scan_window: "02:00-06:00" # окно пересканов (локальное время; старт вне окна откладывается шедулером; через полночь — "22:00-02:00")
  - name: mongo-test
    type: mongodb
    uri: "mongodb://test:${MONGO_TEST_PASSWORD}@192.168.31.119:27017/testdb"

  # Примеры продуктивных подключений (blueprint п. 12) — read-only учётки.
  - name: ch-prod
    type: clickhouse
    dsn: "clickhouse://readonly:${CH_PROD_PASSWORD}@ch-host:9000/analytics"
  - name: mongo-prod
    type: mongodb
    uri: "${MONGO_PROD_URI}"

sso:
  enabled: false # dev-контур: только admin-токен; SAML SP — инкремент 5в-5 (ADR-0011)
  entity_id: "https://zond.example.com/saml/metadata"
  acs_url: "https://zond.example.com/saml/acs" # публичный адрес SP (за TLS-прокси)
  idp_metadata_url: "${IDP_METADATA_URL}" # либо idp_metadata_file: ./idp.xml; refresh — 24 ч
  name_id_format: "urn:oasis:names:tc:SAML:1.1:nameid-format:emailAddress"
  role_attribute: "Role" # SAML-атрибут/группы → роли admin/viewer (MaxRole, п. 11.3)
  admin_token_fallback: true # env CLASSIFIER_ADMIN_TOKEN — bootstrap/аварийный
  # Ключи подписи SP (п. 11.3: файл в конфигурации; ротация «добавить → раскатать → убрать»).
  # Не заданы — ephemeral self-signed на старте (только dev/демо).
  # sp_certificate_file: ./deploy/saml/sp.crt
  # sp_key_file: ./deploy/saml/sp.key
  # cookie_samesite: lax # lax (default) | none (prod за TLS; http-dev + lax: tracked-cookie может не дойти до POST ACS у части браузеров)

# Секреты подключений из HashiCorp Vault (S7в, ADR-0012, blueprint п. 12.1).
# Выключено — прежний режим ${ENV} (выше). Токен — только из env/JWT,
# в конфиге запрещён. Демо-контур: deploy/docker-compose.vault.yml +
