# CI-ворота (blueprint п. 16.7 — базовый набор этапа 0:
# fmt, vet, build, test -race, проверка конфигов; lint — отдельным шагом).
# Расширения этапов 3–7: go-licenses, govulncheck, SBOM, coverage gates.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Format
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Unit tests (race)
        run: go test -race -coverprofile=coverage.out ./...

      - name: Config check (фиктивные ENV из configs/ci.env)
        run: set -a && . ./configs/ci.env && set +a && go run ./cmd/zond config validate

      - name: Lint
        uses: golangci/golangci-lint-action@v7
