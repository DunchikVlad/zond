# CI-ворота (blueprint п. 16.7 — базовый набор этапа 0:
# fmt, vet, build, test -race, проверка конфигов; lint — отдельным шагом).
# Расширения этапов 3–7: go-licenses, govulncheck, SBOM, coverage gates,
# fuzz парсеров (п. 16.10, S8-4).
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Format
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Unit tests (race)
        run: go test -race -coverprofile=coverage.out ./...

      # П. 16.10: fuzz парсеров — BSON-флаттенинг, YAML-конфига,
      # JSON-ответа агента, маскировщиков. Сиды — в f.Add/testdata; прогон
      # короткий (гейт), полный фаззинг — ночной/ручной.
      - name: Fuzz (п. 16.10)
        run: |
          go test -fuzz=FuzzMask -fuzztime=15s ./internal/agentproxy/mask/
          go test -fuzz=FuzzAgentResponse -fuzztime=15s ./internal/agentproxy/
          go test -fuzz=FuzzLoadConnections -fuzztime=15s ./internal/config/
          go test -fuzz=FuzzLoadDetectors -fuzztime=15s ./internal/config/
          go test -fuzz=FuzzLoadTaxonomy -fuzztime=15s ./internal/config/
          go test -fuzz=FuzzFlattenDocument -fuzztime=15s ./internal/connector/mongodb/

      # П. 16.8: нагрузочный тест слоя 1 (1M значений) как CI-гейт;
      # NFR п. 18 — ≥100k значений/мин на ядро. Файл отчёта в раннере не нужен.
      - name: Bench слоя 1 (NFR п. 18)
        run: go run ./cmd/eval bench -out ""

      - name: Config check (фиктивные ENV из configs/ci.env)
        run: set -a && . ./configs/ci.env && set +a && go run ./cmd/zond config validate

      - name: Lint
        uses: golangci/golangci-lint-action@v7

      # П. 16.7: govulncheck без находок High/Critical (блокирует).
      # Прогон через go run — бинарик не нужен; версия БД уязвимостей — свежая.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      # П. 16.7: бан GPL/Commons Clause в зависимостях. Игноры: собственный
      # модуль (в репозитории нет LICENSE-файла) и субпакеты segmentio/asm
      # (лицензия MIT на корне модуля; go-licenses не находит файл в подпакетах).
      - name: Licenses (бан GPL/Commons Clause)
        run: go run github.com/google/go-licenses/v2@latest check --ignore github.com/DunchikVlad/zond --ignore github.com/segmentio/asm ./...
