{{template "header" .}}
<h2>Вход по admin-token</h2>
<p>SSO выключен: доступ — только по admin-token (blueprint п. 12). Токен задаётся
переменной окружения CLASSIFIER_ADMIN_TOKEN на сервере.</p>
{{if .Error}}<p class="error">{{.Error}}</p>{{end}}
<form method="post" action="/login">
  <input type="hidden" name="csrf_token" value="{{.CSRF}}">
  <label>Admin-token:
    <input type="password" name="token" autocomplete="off" autofocus required>
  </label>
  <button type="submit">Войти</button>
</form>
{{template "footer" .}}
