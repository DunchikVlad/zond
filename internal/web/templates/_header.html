{{define "header"}}<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} — zond</title>
<link rel="stylesheet" href="/static/style.css">
<script src="/static/htmx.min.js"></script>
<script>
// CSRF double-submit (п. 14): мутации шлют заголовок X-CSRF-Token
// из cookie zond_csrf; middleware web сравнивает их.
document.body.addEventListener('htmx:configRequest', function (e) {
  var m = document.cookie.match(/(?:^|;\s*)zond_csrf=([^;]+)/);
  if (m) { e.detail.headers['X-CSRF-Token'] = decodeURIComponent(m[1]); }
});
</script>
</head>
<body>
<nav>
  <strong>zond</strong>
  <a href="/scans">Прогоны</a>
  <a href="/verdicts">Вердикты</a>
  <a href="/review">Ревью</a>
  <a href="/drift">Дрейф</a>
  <a href="/cost">Экономика</a>
  <a href="/alerts">Алерты</a>
  <a href="/audit">Аудит</a>
  <a href="/settings">Настройки</a>
  <span class="who">{{.Subject.Actor}} ({{.Subject.Role}})</span>
  <a class="logout" href="/saml/logout">Выйти</a>
</nav>
<main>
<h1>{{.Title}}</h1>
{{end}}
