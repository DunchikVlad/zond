# golangci-lint v2 (формат конфига — v2, см. CI workflow).
# Правила depguard закрепляют границы из architecture.md п. 3 и blueprint п. 10.1.
#
# ВАЖНО: depguard `files` — это GLOB-шаблоны (doublestar), НЕ regex!
# Якоря `^`, группы `(...)`, альтернативы `|` здесь просто не матчат ни один
# файл — правило молча становится вакуумным (поймано пропавшим срабатыванием
# positive control). Отрицания `!` поддержаны и работают вместе с `$all`.
version: "2"

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - depguard
  settings:
    depguard:
      rules:
        domain-no-infrastructure:
          files:
            - "**/internal/verdict/**"
            - "**/internal/analyze/**"
          deny:
            - pkg: net/http
              desc: "domain не импортирует HTTP-клиенты (architecture.md п. 3)"
            - pkg: github.com/ClickHouse/clickhouse-go/v2/**
              desc: "domain не зависит от драйверов БД (architecture.md п. 3)"
            - pkg: go.mongodb.org/mongo-driver/**
              desc: "domain не зависит от драйверов БД (architecture.md п. 3)"
        llm-only-via-agentproxy:
          # net/http разрешён только в internal/agentproxy (единственная точка
          # вызова LLM, blueprint п. 10.1), в internal/api (REST-сервер этапа
          # 5б — не вызывает LLM, ADR-impl-5б), в internal/auth (SAML SP этапа
          # 5в-5 — HTTP-протокол SSO, не вызывает LLM, ADR-impl-5в),
          # internal/web (server-rendered UI этапа 5г — не вызывает LLM,
          # ADR-impl-5г), internal/observe (исходящий webhook алертинга этапа
          # S6в — не вызывает LLM, ADR-impl-6в) и в *_test.go (fake-LLM
          # httptest). Вызовы LLM вне proxy правило по-прежнему поймает:
          # изолирующим является agentproxy, а не отсутствие net/http в
          # api/auth/web/observe.
          files:
            - "$all"
            - "!**/internal/agentproxy/**"
            - "!**/internal/api/**"
            - "!**/internal/auth/**"
            - "!**/internal/web/**"
            - "!**/internal/observe/**"
            - "!**/cmd/**"
            - "!**/*_test.go"
          deny:
            - pkg: net/http
              desc: "вызов LLM только через agentproxy (blueprint п. 10.1)"

  exclusions:
    presets:
      - common-false-positives
      - std-error-handling
